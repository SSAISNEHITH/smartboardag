<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="30" fill="#ffffff"/>
  <g transform="translate(0, 20)">
    <!-- Light Rays -->
    <line x1="250" y1="120" x2="250" y2="105" stroke="#0080ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="215" y1="135" x2="205" y2="122" stroke="#0080ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="285" y1="135" x2="295" y2="122" stroke="#0080ff" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Open Book Outline (Back Pages) -->
    <path d="M 170 170 L 246 170 L 246 295 C 210 270 180 275 160 275 Z" fill="#ffffff" stroke="#002b66" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 330 170 L 254 170 L 254 295 C 290 270 320 275 340 275 Z" fill="#ffffff" stroke="#002b66" stroke-width="9" stroke-linejoin="round"/>

    <!-- Light Bulb -->
    <!-- Bulb Glow Circle -->
    <circle cx="250" cy="180" r="38" fill="#ffb703" stroke="#002b66" stroke-width="9"/>
    <!-- Bulb Base -->
    <rect x="235" y="218" width="30" height="22" rx="4" fill="#0052cc" stroke="#002b66" stroke-width="7"/>
    <line x1="238" y1="225" x2="262" y2="225" stroke="#ffffff" stroke-width="3"/>
    <line x1="238" y1="231" x2="262" y2="231" stroke="#ffffff" stroke-width="3"/>
    <!-- Center spine line -->
    <line x1="250" y1="242" x2="250" y2="300" stroke="#002b66" stroke-width="8"/>

    <!-- Book Bottom Base & Pages -->
    <path d="M 140 310 Q 200 300 250 325 Q 300 300 360 310 L 340 275 C 320 275 290 270 250 298 C 210 270 180 275 160 275 Z" fill="#0077ff" stroke="#002b66" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 140 310 Q 200 295 248 318" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M 360 310 Q 300 295 252 318" fill="none" stroke="#ffffff" stroke-width="4"/>

    <!-- Text SMART TEACH -->
    <text x="250" y="375" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#002b66">SMART TEACH</text>
  </g>
</svg>