spring.application.name=backend

# Railway injects MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE
# Falls back to local MySQL for local development.
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:thrisual}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${MYSQLUSER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQLPASSWORD:${MYSQL_PASSWORD:24HR1A05F0@saisnehithbackbencher}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2b8c56e7e4a1a6b0c2e3d9e8f4a7c1b2c}
jwt.expiration=86400000

# ─── File Storage ───────────────────────────────────────────────────────────
file.upload-dir=storage/

# ─── Server Port (Railway sets PORT automatically) ──────────────────────────
server.port=${PORT:8080}
